<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь Дракона — китайский с нуля</title>
<meta name="description" content="Курс китайского языка с нуля: речь сначала, тоны с микрофоном, интервальные повторения, иероглифы по ключам. Работает на любом устройстве, бесплатно.">
<meta name="theme-color" content="#12141C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ ТОКЕНЫ ============ */
:root{
  --bg:#12141C; --bg2:#1A1D28; --card:#20243100; --card-solid:#202431; --card2:#282D3D;
  --line:#343A4E; --line2:#434A62;
  --fg:#F3F1EA; --fg2:#B9BCCB; --fg3:#7E8397;
  --gold:#F2B33D; --gold2:#FFD27A; --gold-dk:#B8801A; --on-gold:#1A1400;
  --red:#E5533C; --red2:#FF7A64; --red-dk:#A8321F;
  --jade:#2FB58A; --jade2:#6FE0B8; --jade-dk:#1B7A5C; --on-jade:#04231A;
  --blue:#4F7DF2; --purple:#9D6BE0; --gray:#8A90A5;
  --t1:#E5484D; --t2:#46A758; --t3:#3E8BFF; --t4:#A56BE8; --t5:#8A90A5;
  --shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-sm:0 4px 12px rgba(0,0,0,.3);
  --r:20px; --r-sm:12px; --r-xs:8px;
  --zh:"Noto Serif SC","Kaiti SC","KaiTi","STKaiti","Songti SC","Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",serif;
  --zh-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",sans-serif;
  --ui:"Rubik","Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F6F1E6; --bg2:#FFFBF2; --card-solid:#FFFFFF; --card2:#F3EDE0;
  --line:#E3DBC8; --line2:#CFC5AC;
  --fg:#221E17; --fg2:#5B5648; --fg3:#8A8472;
  --gold:#D9961C; --gold2:#F0B94C; --gold-dk:#8E5E06; --on-gold:#1A1400;
  --red:#D34430; --red2:#E86A55; --jade:#1F9A73; --jade2:#3FBF95; --jade-dk:#146A4F;
  --t3:#2E6FE0; --t4:#8A4FD0;
  --shadow:0 10px 30px rgba(80,60,20,.12), inset 0 1px 0 rgba(255,255,255,.7);
  --shadow-sm:0 4px 12px rgba(80,60,20,.1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);line-height:1.5;min-height:100dvh;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(242,179,61,.10),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(47,181,138,.08),transparent 60%);
  background-repeat:no-repeat;}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
::selection{background:rgba(242,179,61,.35)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.zh{font-family:var(--zh);font-weight:500;letter-spacing:.04em}
.zhs{font-family:var(--zh-sans)}
.py{font-variant:no-common-ligatures;letter-spacing:.01em}
.muted{color:var(--fg2)} .dim{color:var(--fg3)} .small{font-size:.875rem} .xs{font-size:.78rem}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1} .sb{justify-content:space-between}
.mt{margin-top:16px} .mb{margin-bottom:16px} .mt-s{margin-top:8px}
h1,h2,h3{margin:0 0 .4em;line-height:1.2;font-weight:700} h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:.4em 0}
/* тоны */
.T1{color:var(--t1)} .T2{color:var(--t2)} .T3{color:var(--t3)} .T4{color:var(--t4)} .T5{color:var(--t5)}
.bgT1{background:var(--t1)} .bgT2{background:var(--t2)} .bgT3{background:var(--t3)} .bgT4{background:var(--t4)} .bgT5{background:var(--t5)}

/* ============ КАРКАС ============ */
#app{max-width:860px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));min-height:100dvh}
@media(min-width:900px){#app{padding-top:24px;padding-left:24px;padding-right:24px;padding-bottom:40px;margin-left:calc(50% - 430px + 60px)}}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;text-decoration:none;color:var(--fg)}
.brand .zh{color:var(--gold);font-size:1.3rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:.9rem;min-height:36px}
.pill svg{width:18px;height:18px}
.pill.gold{color:var(--gold2)} .pill.red{color:var(--red2)} .pill.jade{color:var(--jade2)}
/* нижняя навигация (телефон) / боковая (десктоп) */
nav.main{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:50}
nav.main a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--fg3);font-size:.7rem;font-weight:600;min-height:44px;transition:color .2s}
nav.main a svg{width:24px;height:24px}
nav.main a.on{color:var(--gold)}
nav.main a .badge{position:absolute;transform:translate(14px,-8px);background:var(--red);color:#fff;font-size:.65rem;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
nav.main a{position:relative}
@media(min-width:900px){
  nav.main{left:calc(50% - 430px - 60px);right:auto;top:24px;bottom:auto;width:104px;height:auto;flex-direction:column;justify-content:flex-start;gap:6px;padding:12px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--card-solid);box-shadow:var(--shadow)}
  nav.main a{flex:0 0 auto;padding:10px 4px;border-radius:14px;font-size:.72rem}
  nav.main a.on{background:color-mix(in srgb,var(--gold) 14%,transparent)}
}
@media(max-width:899px){#app{margin-left:auto}}

/* ============ КАРТОЧКИ ============ */
.card{background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative}
.card+.card{margin-top:14px}
.card.flat{box-shadow:none}
.card.gold{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 22%,var(--card-solid)),var(--card-solid));border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.card.jade{background:linear-gradient(135deg,color-mix(in srgb,var(--jade) 20%,var(--card-solid)),var(--card-solid));border-color:color-mix(in srgb,var(--jade) 45%,var(--line))}
.card.red{background:linear-gradient(135deg,color-mix(in srgb,var(--red) 18%,var(--card-solid)),var(--card-solid));border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.stat{padding:14px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:1.5rem;line-height:1.1} .stat span{font-size:.75rem;color:var(--fg3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* ============ КНОПКИ (клей-стиль) ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;font-size:1rem;
  background:var(--card2);color:var(--fg);border:1px solid var(--line2);box-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s,background .2s;user-select:none;text-decoration:none}
.btn:hover{background:var(--line)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 3px 8px rgba(0,0,0,.2)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold2);box-shadow:0 4px 0 var(--gold-dk),0 10px 20px rgba(242,179,61,.25)}
.btn.primary:hover{background:var(--gold2)} .btn.primary:active{box-shadow:0 1px 0 var(--gold-dk),0 3px 8px rgba(242,179,61,.25)}
.btn.jade{background:var(--jade);color:var(--on-jade);border-color:var(--jade2);box-shadow:0 4px 0 var(--jade-dk),0 10px 20px rgba(47,181,138,.25)}
.btn.jade:hover{background:var(--jade2)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red2);box-shadow:0 4px 0 var(--red-dk),0 10px 20px rgba(229,83,60,.25)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.ghost:active{transform:none}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.btn.sm.primary{box-shadow:0 3px 0 var(--gold-dk)}
.btn.icon{width:48px;padding:0} .btn.icon.sm{width:38px}
.btn.block{width:100%} .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:20px;height:20px;flex:none}
.btn.big{min-height:60px;font-size:1.1rem;border-radius:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1;min-width:140px}

/* ============ ПРОГРЕСС ============ */
.bar{height:12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--gold),var(--gold2));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.jade i{background:linear-gradient(90deg,var(--jade-dk),var(--jade),var(--jade2))}
.bar.thin{height:8px}
.ring{position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)} .ring text{transform:rotate(90deg);transform-origin:center}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}

/* ============ ПУТЬ (карта) ============ */
.gate{margin-bottom:22px}
.gate-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow-sm);position:sticky;top:8px;z-index:3}
.gate-head .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--zh);font-size:1.4rem;font-weight:700;background:var(--card2);color:var(--gold)}
.gate.locked .gate-head{opacity:.6}
.path{position:relative;padding:18px 0 4px;display:flex;flex-direction:column;gap:14px}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:var(--line);border-radius:2px;transform:translateX(-50%)}
.node{position:relative;display:flex;align-items:center;gap:12px;width:min(100%,420px);padding:12px 14px;border-radius:18px;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow-sm);text-decoration:none;color:var(--fg);transition:transform .15s}
.node:hover{transform:translateY(-2px)}
.node:nth-child(odd){align-self:flex-start;margin-left:6%} .node:nth-child(even){align-self:flex-end;margin-right:6%}
@media(max-width:520px){.node:nth-child(odd){margin-left:0}.node:nth-child(even){margin-right:0}.node{width:100%}}
.node .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:1.1rem;background:var(--card2);border:3px solid var(--line2);color:var(--fg3)}
.node.done .dot{background:var(--jade);border-color:var(--jade2);color:var(--on-jade)}
.node.cur .dot{background:var(--gold);border-color:var(--gold2);color:var(--on-gold);animation:pulse 2s infinite}
.node.cur{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.node.lock{opacity:.55} .node .dot svg{width:24px;height:24px}
.node .t{font-weight:700} .node .s{font-size:.8rem;color:var(--fg3)}
.node .stars{margin-left:auto;color:var(--gold);font-size:.9rem;letter-spacing:1px;flex:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,179,61,.5)}70%{box-shadow:0 0 0 14px rgba(242,179,61,0)}}

/* ============ УРОК ============ */
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lesson-top .bar{flex:1}
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)} .steps i.on{background:var(--gold)} .steps i.done{background:var(--jade)}
.phrase{text-align:center;padding:18px 10px}
.phrase .zh{font-size:2.4rem;line-height:1.3;display:block;margin-bottom:4px}
.phrase .py{font-size:1.15rem;color:var(--fg2);display:block}
.phrase .ru{font-size:1.05rem;margin-top:8px;display:block}
.phrase .lit{font-size:.85rem;color:var(--fg3);margin-top:4px;display:block}
.phrase .zh.small{font-size:1.7rem}
.syl{display:inline-block;padding:0 .05em}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line)}
.item+.item{margin-top:8px}
.item .zh{font-size:1.5rem;min-width:2.5em}
.item .py{color:var(--fg2);font-size:.95rem} .item .ru{font-size:.95rem}
.item .lit{font-size:.8rem;color:var(--fg3)}
.item .btn{margin-left:auto}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:var(--r-sm);border:2px dashed var(--line2);align-content:flex-start}
.tiles.answer{border-color:var(--gold)}
.tile{min-height:48px;padding:6px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);box-shadow:0 3px 0 var(--line);font-size:1.25rem;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:transform .12s;user-select:none}
.tile small{font-size:.7rem;color:var(--fg3);font-family:var(--ui)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile.used{opacity:.25;pointer-events:none}
.tile.ok{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 20%,var(--card2))}
.tile.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 20%,var(--card2));animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:56px;padding:10px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line2);box-shadow:0 4px 0 var(--line);font-size:1.05rem;text-align:left;display:flex;align-items:center;gap:10px;transition:all .15s}
.opt .zh{font-size:1.5rem}
.opt:hover{border-color:var(--gold)} .opt:active{transform:translateY(3px);box-shadow:none}
.opt.ok{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 25%,var(--card2));box-shadow:0 4px 0 var(--jade-dk)}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 25%,var(--card2));box-shadow:0 4px 0 var(--red-dk)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{justify-content:center;text-align:center;min-height:60px}
.pairs .opt.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--card2))}
.pairs .opt.gone{opacity:.25;pointer-events:none}
.feedback{margin-top:14px;padding:14px;border-radius:var(--r-sm);display:flex;gap:12px;align-items:flex-start;animation:up .25s}
.feedback.ok{background:color-mix(in srgb,var(--jade) 18%,var(--card-solid));border:1px solid var(--jade)}
.feedback.bad{background:color-mix(in srgb,var(--red) 18%,var(--card-solid));border:1px solid var(--red)}
.feedback svg{width:26px;height:26px;flex:none}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dialog .line{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.dialog .line.b{flex-direction:row-reverse}
.dialog .who{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;flex:none}
.dialog .line.b .who{background:var(--gold);color:var(--on-gold)}
.dialog .bub{max-width:80%;padding:10px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.dialog .line.b .bub{background:color-mix(in srgb,var(--gold) 16%,var(--card2))}
.dialog .bub .zh{font-size:1.35rem;display:block} .dialog .bub .py{color:var(--fg2);font-size:.9rem;display:block} .dialog .bub .ru{font-size:.9rem;display:block;margin-top:2px}
.dialog .bub.mine{border-color:var(--gold)}
.hint{padding:10px 14px;border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:.95rem}
.hint.jade{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 8%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.chip.gold{color:var(--gold2);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.chip.jade{color:var(--jade2);border-color:color-mix(in srgb,var(--jade) 50%,var(--line))}
.chip.red{color:var(--red2)}
.chip.blue{color:var(--t3)}
.combo{position:fixed;right:16px;top:14px;z-index:60;padding:8px 14px;border-radius:999px;background:var(--gold);color:var(--on-gold);font-weight:800;box-shadow:var(--shadow-sm);animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ============ МИКРОФОН / ТОНЫ ============ */
.mic{width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;border:4px solid var(--red2);box-shadow:0 6px 0 var(--red-dk),0 14px 30px rgba(229,83,60,.35);transition:transform .15s}
.mic svg{width:36px;height:36px} .mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dk)}
.mic.on{animation:rec 1s infinite;background:var(--jade);border-color:var(--jade2);box-shadow:0 6px 0 var(--jade-dk)}
@keyframes rec{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
canvas.tone{width:100%;height:170px;border-radius:var(--r-sm);background:var(--bg2);border:1px solid var(--line);display:block}
.tone-pick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tone-pick .btn{min-width:64px}
.score{font-size:2rem;font-weight:800}
.heard{padding:12px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line);min-height:52px}
.heard .zh{font-size:1.4rem}

/* ============ ИЕРОГЛИФЫ ============ */
.hz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.hz{aspect-ratio:1;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--fg);transition:transform .15s}
.hz:hover{transform:translateY(-2px);border-color:var(--gold)}
.hz .zh{font-size:2rem;line-height:1} .hz small{font-size:.72rem;color:var(--fg3)}
.hz.known{border-color:var(--jade)} .hz.learn{border-color:var(--gold)}
.writer{width:min(100%,300px);aspect-ratio:1;margin:0 auto;border-radius:var(--r-sm);background:var(--bg2);border:1px solid var(--line);position:relative}
.writer svg{display:block}
.writer .grid{position:absolute;inset:0;pointer-events:none;opacity:.35}
.radical{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line)}
.radical .zh{font-size:2rem;width:56px;text-align:center}

/* ============ ДРАКОН ============ */
.dragon{display:flex;align-items:center;gap:14px}
.dragon svg{width:120px;height:120px;flex:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.dragon .lvl{font-size:.8rem;color:var(--gold2);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.dragon .name{font-size:1.25rem;font-weight:800}
@media(max-width:420px){.dragon svg{width:96px;height:96px}}
.bounce{animation:bounce 2.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ============ КВЕСТЫ / ДОСТИЖЕНИЯ ============ */
.quest{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line)}
.quest+.quest{margin-top:8px}
.quest .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--line);flex:none}
.quest .ic svg{width:22px;height:22px}
.quest.done .ic{background:var(--jade);color:var(--on-jade)}
.quest .bar{margin-top:6px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach .a{padding:12px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line);text-align:center;opacity:.45}
.ach .a.got{opacity:1;border-color:var(--gold)}
.ach .a svg{width:32px;height:32px;color:var(--gold)} .ach .a b{display:block;font-size:.9rem;margin-top:6px} .ach .a span{font-size:.75rem;color:var(--fg3)}

/* ============ ТОСТ / МОДАЛ ============ */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);z-index:100;animation:up .3s;max-width:90vw;text-align:center}
@media(min-width:900px){.toast{bottom:28px}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:90;padding:16px;animation:fade .2s}
.modal .card{max-width:440px;width:100%;animation:pop .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
.list{list-style:none;margin:0;padding:0} .list li{padding:10px 0;border-bottom:1px solid var(--line)} .list li:last-child{border:0}
.wordrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wordrow .zh{font-size:1.45rem;min-width:3em} .wordrow .py{color:var(--fg2)} .wordrow .ru{margin-left:auto;text-align:right;font-size:.95rem}
.wordrow .srs{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.wordrow .srs.l1{background:var(--red)} .wordrow .srs.l2{background:var(--gold)} .wordrow .srs.l3{background:var(--jade)}
input.txt,select.txt{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);color:var(--fg)}
input.txt:focus{border-color:var(--gold);outline:none}
label.lbl{display:block;font-size:.85rem;font-weight:600;color:var(--fg2);margin:12px 0 6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:52px;height:30px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--jade)} .sw.on::after{left:25px}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.timeline .tl{position:relative;padding:6px 0 14px}
.timeline .tl::before{content:"";position:absolute;left:-23px;top:10px;width:13px;height:13px;border-radius:50%;background:var(--line2);border:3px solid var(--bg)}
.timeline .tl.done::before{background:var(--jade)} .timeline .tl.cur::before{background:var(--gold)}
.table{width:100%;border-collapse:collapse;font-size:.95rem} .table td,.table th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.table .zh{font-size:1.25rem}
.pinyin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pinyin-grid .btn{min-height:44px;padding:0 6px;font-size:.95rem;font-weight:600}
.fade-in{animation:up .3s}
.kbd{font-family:ui-monospace,monospace;font-size:.85em;background:var(--card2);border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
